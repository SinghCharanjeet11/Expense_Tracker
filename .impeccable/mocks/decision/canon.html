<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;display:grid;grid-template-columns:240px 1fr}
.rail{background:#fff;border-right:1px solid #e2e8f0;padding:24px 16px}
.rail b{display:block;font-size:20px;margin-bottom:24px}.rail a{display:block;padding:10px 12px;border-radius:8px;color:#475569}.rail a.on{background:#eef2ff;color:#4f46e5}
main{padding:28px 32px;display:grid;grid-template-rows:auto auto 1fr;gap:20px}
.top{display:flex;justify-content:space-between}.btn{background:#4f46e5;color:#fff;padding:10px 16px;border-radius:8px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.c{background:#fff;border-radius:12px;box-shadow:0 1px 3px #0001;padding:18px}
.c .v{font-size:30px;font-weight:700;margin-top:8px}
.g{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:340px}.bars i{flex:1;background:#818cf8;border-radius:4px 4px 0 0}
.d{width:220px;height:220px;border-radius:50%;margin:30px auto;background:conic-gradient(#4f46e5 0 37%,#06b6d4 0 53%,#f59e0b 0 66%,#ec4899 0 77%,#10b981 0 87%,#cbd5e1 0)}
</style></head><body>
<aside class="rail"><b>Ledger</b><a class="on">Dashboard</a><a>Transactions</a><a>Analytics</a></aside>
<main><div class="top"><h1>Dashboard</h1><span class="btn">+ Add expense</span></div>
<div class="k"><div class="c">Total spent<div class="v">₹76,185</div></div><div class="c">This month<div class="v">₹75,736</div></div><div class="c">Average<div class="v">₹1,314</div></div><div class="c">Largest<div class="v">₹8,000</div></div></div>
<div class="g"><div class="c"><div class="bars"><i style="height:8%"></i><i style="height:82%"></i><i style="height:4%"></i><i style="height:14%"></i><i style="height:22%"></i><i style="height:30%"></i><i style="height:26%"></i><i style="height:84%"></i><i style="height:18%"></i><i style="height:56%"></i></div></div><div class="c"><div class="d"></div></div></div>
</main></body></html>
